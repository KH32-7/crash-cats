<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Crash Cats — model preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d1a17; color: #f4ead8; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #bar { position: fixed; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
      #bar button { background: #3a2f27; color: #f4ead8; border: 1px solid #6b5645; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
      #bar button.on { background: #e8742c; border-color: #ffb27a; color: #1d1a17; }
      #info { position: fixed; top: 44px; left: 8px; background: rgba(0,0,0,0.55); padding: 6px 8px; border-radius: 6px; white-space: pre; z-index: 2; font-family: ui-monospace, monospace; font-size: 12px; }
      #thumbs { position: fixed; left: 0; right: 0; bottom: 0; display: none; flex-wrap: wrap; gap: 4px; padding: 6px; background: rgba(20,16,13,0.85); z-index: 2; }
      #thumbs.on { display: flex; }
      #thumbs figure { margin: 0; width: 96px; text-align: center; font-size: 10px; background: #2b241f; border-radius: 6px; padding: 2px; }
      #thumbs img { width: 92px; height: 92px; display: block; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar"></div>
    <div id="info"></div>
    <div id="thumbs"></div>
    <script type="module" src="/src/models-preview.ts"></script>
  </body>
</html>
